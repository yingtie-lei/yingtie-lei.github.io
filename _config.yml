# Personal site
first_name: Yingtie
last_name: Lei
description: Academic homepage of Yingtie Lei, a computer vision researcher at The Ohio State University.
lang: en
url: https://yingtie-lei.github.io
baseurl: ""

markdown: kramdown
include: ["_pages"]
exclude:
  - .legacy-template-backup/
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules/
  - package.json
  - package-lock.json
  - vendor/

plugins:
  - jekyll/scholar
  - jekyll-sitemap

scholar:
  first_name: [Yingtie, Y.]
  last_name: [Lei]
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: paper_code
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  # arXiv identifiers order preprints by submission time within each year.
  sort_by: [year, eprint]
  order: descending
  group_by: none

# Keep assets and the ownership verification file out of search results.
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: google61492b1197e67964.html
    values:
      sitemap: false
