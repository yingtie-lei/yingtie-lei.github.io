name: Deploy al-folio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Version stylesheet URL
        run: |
          ruby <<'RUBY'
          sha = ENV.fetch("GITHUB_SHA")
          updated = 0
          Dir.glob("_site/**/*.html").each do |path|
            html = File.read(path)
            next unless html.gsub!(%r{(/assets/css/main\.css\?v=)[0-9a-f]+}) { Regexp.last_match(1) + sha }

            File.write(path, html)
            updated += 1
          end
          abort "No stylesheet references found" if updated.zero?
          puts "Versioned stylesheet URL in #{updated} HTML files"
          RUBY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
